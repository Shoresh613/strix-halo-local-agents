<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Architecture review and self-audit: time and quality</title>
<desc id="desc">Seven completed B+C sessions in Strix Halo low-power mode using OpenCode Build. Horizontal bars show wall-clock time, starting at zero. Scores out of 24 are subjective one-off assessments. Qwen3.8 IQ2_XS medium runs are highlighted in blue. Tool conditions varied.</desc>
